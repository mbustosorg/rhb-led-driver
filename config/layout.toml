# Physical LED layout and the F16V5 it is wired to.
#
# Each segment is one run of pixels on the car.  It starts on its own sACN
# universe so the F16V5 port setup is easy to read: in the controller's
# String Ports page, set each port's start channel to universe `start_universe`
# channel 1 and its pixel count to `pixels`.  One universe carries 170 RGB
# pixels, so a 300-pixel segment spans 2 universes.
#
# Each segment also gives its shape -- the x,y of every pixel -- with one of
# `path`, `arc` or `points_file` (see rhb_led_driver/geometry.py).  All
# segments share one frame so spatial patterns line up across them.  Here:
# inches, looking at the car from the driver's side, x from the front bumper
# toward the back, y up from the ground.  The gauge's face is turned into
# that plane.  Check a layout with scripts/preview_layout.py.
#
# PIXEL COUNTS, ADDRESSES AND SHAPES ARE PLACEHOLDERS -- measure the real runs.

[controller]
host = "192.168.1.20"   # F16V5 address (static; the rig has no DHCP)
fps = 40
# Brightness ceiling 0..1, applied after the pattern.  Keeps power draw and
# the current through long runs sane no matter what a pattern asks for.
max_brightness = 0.6

[[segment]]
name = "hose"           # overhead hose
pixels = 300
start_universe = 1
path = [[20, 96], [90, 102], [160, 96]]

[[segment]]
name = "handle"
pixels = 60
start_universe = 3
path = [[150, 40], [150, 70]]

[[segment]]
name = "gauge"          # 4' pressure gauge off the back
pixels = 144
start_universe = 4
# Rim of a 4' dial, sweeping clockwise from lower left over the top to lower
# right, the way a gauge needle travels.
arc = { center = [200, 60], radius = 22, start_deg = 225, end_deg = -45 }
